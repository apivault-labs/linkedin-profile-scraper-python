[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-profile-scraper"
version = "0.1.0"
description = "Python SDK for LinkedIn Profile Scraper on Apify. Extract available public LinkedIn profile data without login or cookies. Get identity, location, career, education, skills, activity and transparent completeness metadata. Bulk JSON/CSV/Excel export for CRM research and workflows. Tiered pricing: $2\u2013"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["linkedin-profile", "public-profile-data", "crm-enrichment", "recruiting-research", "lead-research", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/linkedin-profile-scraper-python"
Documentation = "https://github.com/apivault-labs/linkedin-profile-scraper-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/linkedin-profile-scraper-no-cookies"
"Bug Tracker" = "https://github.com/apivault-labs/linkedin-profile-scraper-python/issues"

[tool.setuptools.packages.find]
include = ["linkedin_profile_scraper*"]
